<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Puryta</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e6e4ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17161b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Puryta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: palco de tela cheia com barra de ferramentas flutuante no topo e barra contextual embaixo,
   que só aparece quando há seleção. A interface fica fora do caminho da imagem. */
:root {
  --ui-bg: #f4f3f6; --ui-panel: #ffffff; --ui-line: #d9d6e0; --ui-fg: #25222d; --ui-muted: #6f6a7d;
  --ui-hover: #ebe9f0; --accent: #2f6fe4; --accent-fg: #ffffff; --danger: #c93c3c;
  --canvas: #e6e4ea; --canvas-dot: #cfccd8;
  --shadow: 0 6px 24px rgba(30, 20, 60, .16), 0 1px 3px rgba(30, 20, 60, .12);
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ui-bg: #1b1a20; --ui-panel: #25232b; --ui-line: #37343f; --ui-fg: #ecebf1; --ui-muted: #9a96a8;
  --ui-hover: #302d38; --accent: #6aa2ff; --accent-fg: #0c1a33; --danger: #ff7b7b;
  --canvas: #17161b; --canvas-dot: #28262f; --shadow: 0 8px 28px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --ui-bg: #1b1a20; --ui-panel: #25232b; --ui-line: #37343f; --ui-fg: #ecebf1; --ui-muted: #9a96a8;
  --ui-hover: #302d38; --accent: #6aa2ff; --accent-fg: #0c1a33; --danger: #ff7b7b;
  --canvas: #17161b; --canvas-dot: #28262f; --shadow: 0 8px 28px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4); color-scheme: dark; }
/* tom do fundo do canvas, escolhido pela usuária */
:root[data-tone="mid"] { --canvas: #8a8794; --canvas-dot: #7b7886; }
:root[data-tone="light"] { --canvas: #efeef2; --canvas-dot: #d6d3de; }
:root[data-tone="black"] { --canvas: #0b0b0d; --canvas-dot: #1a1a1e; }

[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; padding: 0; background: var(--ui-bg); color: var(--ui-fg); font-family: var(--font); font-size: 15px; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#stage { position: absolute; inset: 0; background-color: var(--canvas); touch-action: none; overflow: hidden; cursor: default;
  background-image: radial-gradient(var(--canvas-dot) 1.2px, transparent 1.3px); }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.item { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.item img { display: block; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; }
.item.note { padding: 4px; font: 400 22px/1.25 var(--font); width: max-content; border-radius: 4px; }
.item.note.plain { white-space: pre-wrap; }
.item.note p, .item.note li { white-space: pre-wrap; margin: 0; }
.item.note ul, .item.note ol { margin: 0; padding-left: 1.4em; }
.item.locked { outline: 0; }
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui svg.sel { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#ui .h { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; pointer-events: auto; display: grid; place-items: center; touch-action: none; }
#ui .h::after { content: ""; width: 14px; height: 14px; border-radius: 4px; background: var(--ui-panel); border: 2px solid var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
#ui .h.rot::after { border-radius: 50%; width: 18px; height: 18px; background: var(--accent); }
#marquee { position: absolute; border: 1.5px dashed var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); display: none; pointer-events: none; }

.bar { position: absolute; z-index: 5; display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--ui-panel); border: 1px solid var(--ui-line); border-radius: 14px; box-shadow: var(--shadow); max-width: calc(100% - 24px); }
#top { top: calc(env(safe-area-inset-top, 0px) + 10px); left: 12px; }
#top2 { top: calc(env(safe-area-inset-top, 0px) + 10px); right: 12px; }
#ctx { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); overflow-x: auto; }
.btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-width: 44px; height: 44px; padding: 0 11px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--ui-hover); } .btn:active { background: var(--ui-line); }
.btn:focus-visible, .row:focus-visible, .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.btn[disabled] { opacity: .35; pointer-events: none; }
.btn.danger { color: var(--danger); }
.btn .t { font-size: 13px; }
.sep { width: 1px; align-self: stretch; margin: 8px 3px; background: var(--ui-line); }
#boardname { max-width: 34vw; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 760px) { .btn .t.hide-s { display: none; } #boardname { max-width: 22vw; } }

#empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; pointer-events: none; z-index: 2; }
#empty .card { pointer-events: auto; width: min(460px, 100%); background: var(--ui-panel); border: 1px solid var(--ui-line); border-radius: 18px; box-shadow: var(--shadow); padding: 26px 24px 22px; display: grid; gap: 14px; }
#empty .logo { border-radius: 15px; display: block; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
#empty h1 { margin: 0; font-size: 24px; line-height: 1.15; letter-spacing: -.01em; text-wrap: balance; }
#empty p { margin: 0; color: var(--ui-muted); line-height: 1.45; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.cta .btn { border: 1px solid var(--ui-line); height: 48px; padding: 0 16px; }
.cta .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }

#sheet { position: absolute; inset: 0; z-index: 20; display: none; background: rgba(10, 8, 20, .45); }
#sheet.on { display: block; }
#panel { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 12px; width: min(420px, calc(100% - 24px)); max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow: auto;
  background: var(--ui-panel); border: 1px solid var(--ui-line); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; display: grid; gap: 10px; }
#panel h2 { margin: 2px 4px 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ui-muted); font-weight: 600; }
.row { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: 12px; border: 1px solid var(--ui-line); min-width: 0; }
.row.cur { border-color: var(--accent); }
.row .nm { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 8px 0; cursor: pointer; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .nm small { display: block; font-weight: 400; color: var(--ui-muted); font-size: 12px; }
.row input { flex: 1; min-width: 0; font: inherit; font-weight: 600; background: var(--ui-bg); color: var(--ui-fg); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 10px; -webkit-user-select: text; user-select: text; }
.hint { margin: 0 4px; color: var(--ui-muted); font-size: 13px; line-height: 1.45; }
#toast { position: absolute; z-index: 30; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 74px); transform: translateX(-50%); max-width: min(520px, calc(100% - 32px)); background: var(--ui-fg); color: var(--ui-bg); padding: 10px 16px; border-radius: 12px; box-shadow: var(--shadow); font-weight: 500; font-size: 14px; line-height: 1.4; display: none; }
#toast.on { display: block; }
#drop { position: absolute; inset: 8px; z-index: 15; display: none; border: 3px dashed var(--accent); border-radius: 18px; pointer-events: none; background: color-mix(in srgb, var(--accent) 10%, transparent); }
#drop.on { display: block; }
@media (prefers-reduced-motion: no-preference) { #toast { animation: up .18s ease-out; } @keyframes up { from { opacity: 0; margin-top: -6px; } } }
</style>
</head>

<script>
/* Leitor de arquivos .pur do PureRef 2.x.
 *
 * Estrutura (descoberta por análise do arquivo, versão 2.1.3):
 *  - O arquivo inteiro é um banco SQLite (páginas de 4096 bytes).
 *  - Os primeiros N bytes do banco foram sobrescritos por um cabeçalho do PureRef
 *    (versão, hash, miniatura JPEG) e os bytes originais ficam copiados no FINAL do arquivo.
 *  - O u32 big-endian no offset 18 do arquivo é o offset onde esse final começa.
 *  - Colunas binárias (transform, bounds...) foram gravadas como TEXT: cada byte virou um
 *    caractere Latin-1 codificado em UTF-8. Aqui desfazemos isso.
 *  - Valores binários são QVariant do Qt (QDataStream big-endian).
 */
(function (root) {
  'use strict';

  const SQLITE_MAGIC = 'SQLite format 3\0';

  function dvOf(u8) { return new DataView(u8.buffer, u8.byteOffset, u8.byteLength); }

  /* ---------- 1. Reconstrução do banco ---------- */
  function rebuildDatabase(file) {
    const dv = dvOf(file);
    if (file.length < 64) throw new Error('Arquivo pequeno demais para ser um .pur.');
    const dbOff = dv.getUint32(18, false);
    const headLen = file.length - dbOff;
    const magicAt = (o) => String.fromCharCode(...file.subarray(o, o + 16));
    if (dbOff > 0 && dbOff < file.length && magicAt(dbOff) === SQLITE_MAGIC) {
      const out = new Uint8Array(dbOff);
      out.set(file.subarray(dbOff), 0);                         // bytes originais do início
      out.set(file.subarray(headLen, dbOff), file.length - dbOff); // resto do banco
      return out;
    }
    if (magicAt(0) === SQLITE_MAGIC) return file; // banco puro, sem cabeçalho
    throw new Error('Este não parece ser um .pur do PureRef 2.x (talvez seja um arquivo da versão 1.x).');
  }

  /* ---------- 2. Leitor mínimo de SQLite (somente leitura) ---------- */
  function SqliteReader(db) {
    const dv = dvOf(db);
    let pageSize = dv.getUint16(16, false); if (pageSize === 1) pageSize = 65536;
    const reserved = db[20];
    const U = pageSize - reserved;
    const textEnc = dv.getUint32(56, false); // 1 = UTF-8
    if (textEnc !== 1 && textEnc !== 0) throw new Error('Codificação de texto SQLite não suportada.');
    const td = new TextDecoder('utf-8');
    const page = (n) => db.subarray((n - 1) * pageSize, n * pageSize);

    function varint(buf, o) {
      let v = 0n, i = 0;
      for (; i < 8; i++) { const b = buf[o + i]; v = (v << 7n) | BigInt(b & 0x7f); if (!(b & 0x80)) return [Number(v), o + i + 1]; }
      const b = buf[o + 8]; v = (v << 8n) | BigInt(b); return [Number(BigInt.asIntN(64, v)), o + 9];
    }

    function readPayload(buf, pstart, P, isTable) {
      const X = U - 35, M = Math.floor(((U - 12) * 32) / 255) - 23;
      if (P <= X) return buf.subarray(pstart, pstart + P);
      let local = M + ((P - M) % (U - 4)); if (local > X) local = M;
      const out = new Uint8Array(P);
      out.set(buf.subarray(pstart, pstart + local), 0);
      let got = local, ov = new DataView(buf.buffer, buf.byteOffset).getUint32(pstart + local, false);
      while (got < P && ov) {
        const pg = page(ov), next = dvOf(pg).getUint32(0, false);
        const take = Math.min(U - 4, P - got);
        out.set(pg.subarray(4, 4 + take), got); got += take; ov = next;
      }
      return out;
    }

    function decodeRecord(p) {
      let [hlen, o] = varint(p, 0); const types = [];
      while (o < hlen) { let t; [t, o] = varint(p, o); types.push(t); }
      const pd = dvOf(p), vals = []; let q = hlen;
      for (const t of types) {
        if (t === 0) vals.push(null);
        else if (t >= 1 && t <= 6) {
          const n = [0, 1, 2, 3, 4, 6, 8][t]; let v = 0n;
          for (let i = 0; i < n; i++) v = (v << 8n) | BigInt(p[q + i]);
          v = BigInt.asIntN(n * 8, v); vals.push(Number(v)); q += n;
        } else if (t === 7) { vals.push(pd.getFloat64(q, false)); q += 8; }
        else if (t === 8) vals.push(0); else if (t === 9) vals.push(1);
        else if (t >= 12) {
          const n = t % 2 === 0 ? (t - 12) / 2 : (t - 13) / 2;
          const bytes = p.subarray(q, q + n); q += n;
          vals.push(t % 2 === 0 ? bytes.slice() : { text: bytes.slice() });
        } else throw new Error('Tipo de coluna SQLite inválido.');
      }
      return vals;
    }

    function walk(pgno, cb) {
      const pg = page(pgno), pv = dvOf(pg), base = pgno === 1 ? 100 : 0, type = pg[base];
      const n = pv.getUint16(base + 3, false);
      if (type === 0x0d) {
        for (let i = 0; i < n; i++) {
          let o = pv.getUint16(base + 8 + i * 2, false), P, rowid;

async function renderSheet() {
  const list = (await store.list()).sort((a, b) => b.updated - a.updated);
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let h = '<div style="display:flex;align-items:center;justify-content:space-between"><h2>Meus boards</h2><button class="btn" data-s="close" aria-label="Fechar">' + icon('close') + '</button></div>';
  if (!store.db) h += '<p class="hint">Este navegador não deixa salvar boards. Exporte um backup para não perder o trabalho.</p>';
  if (!list.length && store.db) h += '<p class="hint">Nenhum board salvo ainda. Abra um .pur ou adicione imagens para começar.</p>';
  for (const b of list) {
    const cur = board && b.id === board.id;
    h += '<div class="row' + (cur ? ' cur' : '') + '">' + (renaming === b.id ? '<input id="rn" value="' + esc(b.name) + '" aria-label="Nome do board">' + '<button class="btn" data-s="rnok" data-id="' + b.id + '" aria-label="Salvar nome">OK</button>'
      : '<button class="nm" data-s="open" data-id="' + b.id + '">' + esc(b.name) + '<small>' + (b.count || 0) + ' itens · ' + fmtDate(b.updated) + '</small></button>' + '<button class="btn" data-s="rename" data-id="' + b.id + '" aria-label="Renomear">' + icon('edit') + '</button>')
      + '<button class="btn danger" data-s="del" data-id="' + b.id + '" aria-label="Apagar board">' + (confirmDel === b.id ? '<span class="t">Apagar?</span>' : icon('trash')) + '</button></div>';
  }
  h += '<div class="cta"><button class="btn" data-s="new">' + icon('plus') + 'Novo board</button><button class="btn primary" data-s="pur" style="background:var(--accent);color:var(--accent-fg)">' + icon('open') + 'Abrir .pur</button>' + (board && board.id !== 'tmp' ? '<button class="btn" data-s="export">' + icon('down') + 'Backup do board atual</button>' : '') + '</div>';
  h += '<p class="hint">Os boards ficam salvos só neste navegador. Se você limpar os dados do Safari eles somem, então guarde seus .pur originais e faça um backup de vez em quando.</p>';
  panel.innerHTML = h; const rn = $('#rn'); if (rn) { rn.focus(); rn.select(); rn.addEventListener('keydown', (e) => { if (e.key === 'Enter') doRename(renaming, rn.value); }); }
}
async function doRename(id, name) {
  name = (name || '').trim() || 'Sem nome';
  if (board && board.id === id) { board.name = name; updateChrome(); await saveNow(); }
  else { const b = await store.load(id); if (b) { b.name = name; await store.save(b); } }
  renaming = null; renderSheet();
}
panel.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-s]'); if (!b) return; const id = b.dataset.id, s = b.dataset.s;
  if (s === 'close') closeSheet();
  else if (s === 'open') { if (board && board.id === id) closeSheet(); else openBoard(id); }
  else if (s === 'new') { await saveNow(); newBoard('Novo board'); closeSheet(); }
  else if (s === 'pur') { closeSheet(); act.open(); }
  else if (s === 'export') exportBackup();
  else if (s === 'rename') { renaming = id; renderSheet(); }
  else if (s === 'rnok') doRename(id, $('#rn').value);
  else if (s === 'del') {
    if (confirmDel !== id) { confirmDel = id; renderSheet(); return; }
    await store.remove(id); confirmDel = null;
    if (board && board.id === id) { pref.set('last', ''); newBoard('Novo board'); }
    renderSheet();
  }
});

/* ================= Início ================= */
(async function start() {
  setTone(pref.get('tone') || 'auto');
  board = { id: 'tmp', name: 'Boards', items: [], images: {}, view: { x: stage.clientWidth / 2, y: stage.clientHeight / 2, z: 1 }, nextId: 1 };
  rebuildAll();
  window.__mesa = { get board() { return board; }, importPur, handleFiles };
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ok */ }
  const opened = await Promise.race([store.open(), new Promise((r) => setTimeout(() => r(false), 3000))]);
  const last = pref.get('last');
  if (opened && store.db && last) {
    try { const b = await store.load(last); if (b && board.id === 'tmp' && !board.items.length) { board = b; rebuildAll(); if (b.items.length && (!b.view || !isFinite(b.view.z))) fitAll(); } } catch (err) { /* começa vazio */ }
  }
})();
})();

</script>

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
